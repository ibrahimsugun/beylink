# Crawler/bot User-Agent tespiti → sunucu-taraflı OG/meta (prerender).
# İnsanlar SPA'ya (index.html) gider; botlar backend /api/prerender'a yönlenir.
map $http_user_agent $beylink_is_bot {
  default 0;
  "~*(facebookexternalhit|Facebot|Twitterbot|WhatsApp|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest|redditbot|Applebot|Googlebot|bingbot|Yandex|Baiduspider|vkShare|Embedly|Iframely|SkypeUriPreview|nuzzel|Qwantify|Google-InspectionTool)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sıkıştırma
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Statik varlıklar için cache
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API → backend (api servisi, aynı docker ağı)
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer $http_referer;
  }

  # Teknik SEO — kök path'lerde (standart: /robots.txt, /sitemap.xml, /feed.xml).
  # Backend seoRoutes dinamik üretir (sitemap public profilleri DB'den okur).
  location = /robots.txt  { proxy_pass http://api:4000/robots.txt;  proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://api:4000/sitemap.xml; proxy_set_header Host $host; }
  location = /feed.xml    { proxy_pass http://api:4000/feed.xml;    proxy_set_header Host $host; }

  # Yüklenen görseller → backend
  location /uploads/ {
    proxy_pass http://api:4000/uploads/;
    proxy_set_header Host $host;
  }

  # Public rotalar (/:username dâhil) — gerçek dosya varsa onu ver, yoksa @app'e düş
  location / {
    try_files $uri $uri/ @app;
  }

  # @app: bot ise sunucu-taraflı prerender (OG/meta), insan ise SPA kabuğu.
  # Not: if-içi proxy_pass eşleşince isteği tümüyle üstlenir; eşleşmezse try_files SPA'yı sunar.
  location @app {
    if ($beylink_is_bot) {
      proxy_pass http://api:4000/api/prerender$uri;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    try_files /index.html =404;
  }
}
